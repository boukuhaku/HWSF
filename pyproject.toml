[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hwsf"
version = "1.0.0"
description = "Hierarchical Weather-SST Fusion (HWSF) for preharvest municipal rice yield estimation with uncertainty quantification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "torch>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
"Project page" = "https://boukuhaku.github.io/hwsf-rice-yield/"

[tool.setuptools.packages.find]
include = ["hwsf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
